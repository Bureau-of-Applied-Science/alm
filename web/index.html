<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALM — ambient log monitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg-void:#0b100d; --ink-primary:#58b264; --ink-dim:#64776a; --ink-faint:#4b5a4a; --ink-label:#a3b9a6;
  --accent-info:#43a251; --accent-warn:#f2a73b; --accent-error:#ea5b34; --accent-debug:#6f8a76;
  --accent-catch:#f4e6c4; --accent-replay:#e8b84a; --chassis-amber:#e0951f; --lane-line: rgba(255,255,255,0.035);
}
*{box-sizing:border-box;}
html,body{ margin:0; height:100%; width:100%;
  background: radial-gradient(120% 140% at 15% -10%, #131b15 0%, var(--bg-void) 45%, #070a08 100%);
  color:var(--ink-primary); font-family:'JetBrains Mono', monospace; overflow:hidden; }
#app{ position:relative; height:100vh; width:100vw; display:flex; flex-direction:column; }
/* atmosphere sits BENEATH everything: only the lane edge fade may dim text (DESIGN 4.6) */
#app::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,0.25) 100%); }
/* nameplate: the Bureau mark and model legend sit BEHIND the datafeed (below #lanes), like a plate on the chassis */
#nameplate{ position:absolute; inset:0; z-index:0; pointer-events:none; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2.2vmin; user-select:none; }
#nameplate .bureau-mark{ width:min(46vw, 640px); height:auto; opacity:0.16; }
#nameplate .legend{ font-family:'Space Grotesk', sans-serif; text-transform:uppercase; letter-spacing:0.42em; font-size:clamp(10px,1.5vmin,14px);
  color:#c9740e; opacity:0.32; display:flex; gap:1.6em; align-items:center; padding-top:1.4vmin; border-top:1px solid rgba(201,116,14,0.35); }
#nameplate .legend b{ font-weight:600; }
header.chrome, #lanes, footer.status{ position:relative; }

header.chrome{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px 10px 22px;
  font-family:'Space Grotesk', sans-serif; z-index:5; }
.brand{ display:flex; align-items:center; gap:9px; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-dim); }
.brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent-info); box-shadow:0 0 8px var(--accent-info); animation:pulse 2.4s ease-in-out infinite; }
.brand .dot.offline{ background:var(--accent-error); box-shadow:0 0 8px var(--accent-error); }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.controls{ display:flex; align-items:center; gap:14px; }
.filters{ display:flex; gap:6px; }
.chip{ font-family:'Space Grotesk', sans-serif; background:transparent; border:1px solid rgba(255,255,255,0.08);
  color:var(--ink-dim); font-size:11px; letter-spacing:0.06em; padding:5px 11px; border-radius:100px; cursor:pointer; transition:all .15s ease; }
.chip:hover{ border-color:rgba(255,255,255,0.22); color:var(--ink-primary); }
.chip.active{ color:var(--bg-void); background:var(--ink-primary); border-color:var(--ink-primary); }
.presence{ font-family:'Space Grotesk', sans-serif; background:rgba(67,162,81,0.08); border:1px solid rgba(67,162,81,0.35);
  color:var(--accent-info); font-size:11px; letter-spacing:0.06em; padding:6px 13px; border-radius:100px; cursor:pointer;
  display:flex; align-items:center; gap:7px; transition:all .18s ease; }
.presence.away{ background:rgba(232,184,74,0.08); border-color:rgba(232,184,74,0.4); color:var(--accent-replay); }
.presence .pip{ width:6px; height:6px; border-radius:50%; background:currentColor; }

#lanes{ position:relative; z-index:1; flex:1; padding:4px 0; }
.lane{ position:relative; height:100%; width:100%; border-bottom:1px solid var(--lane-line); overflow:hidden;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 17%, black 83%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, black 17%, black 83%, transparent 100%); }
.lanes-col{ display:flex; flex-direction:column; height:100%; }
.stream{ position:absolute; top:50%; left:0; transform:translate(0,-50%); white-space:nowrap; font-size:13px;
  letter-spacing:0.01em; display:flex; align-items:center; gap:8px; cursor:pointer; padding:0 4px; height:100%; }
.stream:hover{ background:rgba(255,255,255,0.045); filter:brightness(1.25); }
.stream .head{ font-weight:600; opacity:0.9; }
.stream .src{ color:var(--ink-label); font-size:11px; opacity:0.9; }
.stream .msg-wrap{ max-width:520px; overflow:hidden; position:relative; }
.stream .msg-wrap.overflow{
  -webkit-mask-image: linear-gradient(to right, black 0%, black 85%, transparent 100%);
  mask-image: linear-gradient(to right, black 0%, black 85%, transparent 100%); }
.stream .msg{ display:inline-block; white-space:nowrap; will-change:transform; }
.stream.lvl-info .head{ color:var(--accent-info); }
.stream.lvl-warn .head{ color:var(--accent-warn); }
.stream.lvl-error .head{ color:var(--accent-error); }
.stream.lvl-debug .head{ color:var(--accent-debug); }
.stream.lvl-info .msg{ color:var(--ink-primary); text-shadow: 0 0 6px rgba(67,162,81,0.22), 5px 0 0 rgba(67,162,81,0.10), 10px 0 0 rgba(67,162,81,0.05); }
.stream.lvl-warn .msg{ color:#f6cf8a; text-shadow: 0 0 6px rgba(242,167,59,0.25), 5px 0 0 rgba(242,167,59,0.14), 10px 0 0 rgba(242,167,59,0.06); }
.stream.lvl-error .msg{ color:#f5a98a; text-shadow: 0 0 6px rgba(234,91,52,0.28), 5px 0 0 rgba(234,91,52,0.16), 10px 0 0 rgba(234,91,52,0.07); }
.stream.lvl-debug .msg{ color:var(--ink-faint); }
/* warn and error lines sit on a phosphor band, as on a CRT with the line highlighted; info and debug have none */
.stream.lvl-warn{ background:linear-gradient(90deg, transparent, rgba(242,167,59,0.12) 5%, rgba(242,167,59,0.03) 85%, transparent); }
.stream.lvl-error{ background:linear-gradient(90deg, transparent, rgba(234,91,52,0.20) 5%, rgba(234,91,52,0.05) 85%, transparent); }
.stream.replay .head{ color:var(--accent-replay); }
.stream.replay::before{ content:"REPLAY"; font-family:'Space Grotesk',sans-serif; font-size:9px; letter-spacing:0.12em;
  color:var(--accent-replay); border:1px solid rgba(232,184,74,0.4); border-radius:4px; padding:1px 5px; margin-right:2px; opacity:0.85; }
.stream.fresh{ animation: freshGlow 700ms ease-out; }
@keyframes freshGlow{ 0%{ filter:brightness(1); box-shadow:0 0 0 rgba(255,255,255,0);} 25%{ filter:brightness(1.5); box-shadow:0 0 18px rgba(255,255,255,0.28);} 100%{ filter:brightness(1); box-shadow:0 0 0 rgba(255,255,255,0);} }
.stream.caught{ background:rgba(244,230,196,0.07); box-shadow:0 0 0 1px rgba(244,230,196,0.35), 0 0 18px rgba(244,230,196,0.18); border-radius:6px; }
.stream.caught .msg-wrap{ mask-image:none; -webkit-mask-image:none; max-width:none; }
.stream.caught .msg{ text-shadow:none; }

footer.status{ display:flex; align-items:center; gap:12px; padding:9px 22px 14px 22px; font-family:'Space Grotesk', sans-serif;
  font-size:11px; color:var(--ink-dim); letter-spacing:0.04em; z-index:5; }
.badge{ background:rgba(232,184,74,0.12); color:var(--accent-replay); border:1px solid rgba(232,184,74,0.35);
  border-radius:100px; padding:3px 10px; font-size:10.5px; cursor:pointer; }
.hidden{ display:none !important; }

/* timeline controls: one faint toggle at the lower right (right-thumb reach, opposite the clock) that opens a column of window keys.
   Sits inboard of the 24px screensaver exit-swipe zones. Closed it is nearly invisible; it closes itself after a few seconds. */
#tlControls{ position:absolute; right:44px; bottom:46px; z-index:14; display:flex; flex-direction:column-reverse; align-items:flex-end; gap:7px;
  font-family:'Space Grotesk', sans-serif; padding:6px; border-radius:16px; opacity:0.28; transition:opacity .2s steps(3); }
#tlControls .tl-label{ font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-dim); cursor:pointer; padding:11px 14px;
  border:1px solid rgba(255,255,255,0.08); border-radius:100px; user-select:none; -webkit-tap-highlight-color:transparent; }
#tlControls.live .tl-label{ color:var(--accent-replay); border-color:rgba(232,184,74,0.35); }
#tlControls:not(.open) .chip{ display:none; }
#tlControls.live{ opacity:0.7; }
#tlControls.open, #tlControls:hover{ opacity:1; }
#tlControls.open{ background:rgba(11,16,13,0.86); border:1px solid rgba(255,255,255,0.09); }
#tlControls .chip{ min-width:76px; padding:11px 18px; font-size:12px; text-align:center; }
#tlControls .chip.tl-on{ color:var(--bg-void); background:var(--accent-replay); border-color:var(--accent-replay); }
#tlControls .tl-act{ border-color:rgba(232,184,74,0.35); color:var(--accent-replay); }

/* timeline clock: a playback module on the chassis (DESIGN 4.7). Plate = Bureau amber/cream furniture; lit parts use the replay channel color. */
#tlClock{ position:absolute; left:34px; bottom:46px; z-index:0; width:252px; padding:6px 9px 7px; border-radius:5px; pointer-events:none;
  background:rgba(24,21,16,0.45); border:1px solid rgba(62,59,54,0.7); font-family:'Space Grotesk', sans-serif; opacity:0.62; }   /* behind #lanes: streams stay on top and legible */
#tlClock::before, #tlClock::after{ content:""; position:absolute; top:5px; width:5px; height:5px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #6d655a, #2a261f); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.5); }
#tlClock::before{ left:5px; } #tlClock::after{ right:5px; }
#tlClock .plate{ display:flex; justify-content:space-between; align-items:baseline; padding:0 12px 5px; font-size:9px;
  letter-spacing:0.32em; text-transform:uppercase; color:#c9740e; }
#tlClock .plate i{ font-style:normal; color:#7d6a52; letter-spacing:0.2em; }
#tlClock .glass{ position:relative; padding:6px 9px 5px; background:rgba(11,10,8,0.5); border-radius:3px;
  box-shadow:inset 0 0 0 1px #000, inset 0 2px 7px rgba(0,0,0,0.9), 0 1px 0 rgba(249,237,217,0.06); }
#tlClock .readout{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
#tlClock .time{ font:500 24px 'JetBrains Mono', monospace; color:var(--chassis-amber); letter-spacing:0.04em; line-height:1;
  text-shadow:0 0 5px rgba(224,149,31,0.25); font-variant-numeric:tabular-nums; }
#tlClock .meta{ font:500 10.5px 'JetBrains Mono', monospace; letter-spacing:0.08em; color:#a8925f; white-space:nowrap; }
#tlClock svg.strip{ display:block; width:100%; height:20px; margin-top:7px; }
#tlClock .trk{ stroke:rgba(224,149,31,0.13); } #tlClock .lit{ stroke:var(--chassis-amber); filter:none; }
#tlClock .cut{ stroke:#0d0b09; } #tlClock .scl{ stroke:#6b5a3c; stroke-width:1; }
#tlClock .ends{ display:flex; justify-content:space-between; font-size:8.5px; letter-spacing:0.24em; color:#7d6a52; text-transform:uppercase; }
#tlClock .lamps{ display:flex; gap:14px; padding:6px 12px 0; font-size:8.5px; letter-spacing:0.26em; text-transform:uppercase; color:#7d6a52; }
#tlClock .lamps span::before{ content:""; display:inline-block; width:7px; height:7px; margin-right:6px; vertical-align:-1px;
  border-radius:1px; background:#2b261d; box-shadow:inset 0 0 0 1px #000; }
#tlClock .lamps span.on{ color:#e8d3a8; } #tlClock .lamps span.on::before{ background:var(--chassis-amber); box-shadow:0 0 3px rgba(224,149,31,0.5); }
#tlClock .lamps span.on.hold::before{ animation:lampBlink 1.2s steps(1) infinite; }
@keyframes lampBlink{ 50%{ background:#2b261d; box-shadow:inset 0 0 0 1px #000; } }
#tlClock.paused .time{ animation:lampBlink2 1.2s steps(1) infinite; }
@keyframes lampBlink2{ 50%{ opacity:0.45; } }
#tlClock:not(.hidden) .glass{ animation:refresh .28s steps(1) 1; }   /* display refresh on engage */
/* leaving: the readout breaks up in stepped slices, flashes, collapses to a line and goes (when the replays have left) */
#tlClock.glitch{ animation:clockGlitch .52s steps(1,end) forwards; }
#tlClock.glitch .time{ text-shadow:3px 0 #ea5b34, -3px 0 #f4e6c4; }
@keyframes clockGlitch{
  0%{ opacity:0.62; transform:none; clip-path:none; filter:none; }
  10%{ opacity:0.9; transform:translateX(-6px) skewX(-8deg); clip-path:inset(0 0 60% 0); filter:brightness(1.8); }
  20%{ opacity:0.5; transform:translateX(7px); clip-path:inset(35% 0 18% 0); filter:none; }
  30%{ opacity:0.8; transform:translateX(-3px) skewX(5deg); clip-path:inset(0 0 0 0); filter:brightness(1.5); }
  42%{ opacity:0.15; transform:translateX(9px); clip-path:inset(55% 0 0 0); filter:none; }
  52%{ opacity:0.85; transform:translateX(-8px); clip-path:inset(12% 0 40% 0); filter:brightness(2); }
  64%{ opacity:0.4; transform:translateX(2px) skewX(-4deg); clip-path:none; filter:none; }
  76%{ opacity:0.95; transform:scaleY(0.06); clip-path:none; filter:brightness(2.6); }
  90%{ opacity:0.7; transform:scale(0.5,0.015); filter:brightness(3); }
  100%{ opacity:0; transform:scale(0.2,0.01); }
}
@keyframes refresh{ 0%{ opacity:0; } 25%{ opacity:0.6; } 50%{ opacity:0.2; } 75%{ opacity:0.9; } 100%{ opacity:1; } }

/* screensaver mode (?screensaver=1): no header chrome, interactive streams, cursor hides when calm.
   Leaving is an inward edge swipe or Escape (see "screensaver exit" in the script). */
body.ss{ touch-action:none; }
body.ss.calm{ cursor:none; }
body.ss header.chrome, body.ss #statusText{ display:none !important; }
body.ss footer.status{ position:fixed; left:50%; bottom:76px; transform:translateX(-50%); padding:0; z-index:12; }
#ssOffline{ position:fixed; left:50%; bottom:3vh; transform:translateX(-50%); font:11px 'Space Grotesk',sans-serif;
  letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); z-index:30; }

#detailPanel{ position:fixed; right:22px; bottom:60px; width:420px; max-width:calc(100vw - 44px);
  background:#0e1510; border:1px solid rgba(244,230,196,0.3); border-radius:10px; padding:18px 18px 16px 18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02); z-index:20; animation:slideIn .22s ease; }
@keyframes slideIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
#detailPanel .dp-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
#detailPanel .dp-level{ font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
  padding:2px 9px; border-radius:100px; border:1px solid; }
#detailPanel .dp-close{ background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px; line-height:1; }
#detailPanel .dp-close:hover{ color:var(--ink-primary); }
#detailPanel .dp-meta{ font-size:11px; color:var(--ink-label); margin-bottom:12px; display:flex; gap:14px; }
#detailPanel .dp-msg{ font-size:13px; line-height:1.6; color:var(--ink-primary); white-space:pre-wrap; word-break:break-word; }
#detailPanel .dp-hint{ font-size:10.5px; color:var(--ink-faint); margin-top:12px; }
#detailPanel .dp-explain{ margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.08); font-family:'Space Grotesk',sans-serif; }
#detailPanel .dp-cat{ font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--chassis-amber); margin-bottom:5px; }
#detailPanel .dp-title{ font-size:14px; color:var(--ink-primary); margin-bottom:9px; }
#detailPanel .dp-row{ display:flex; gap:12px; font-size:12.5px; line-height:1.55; color:#b9c9bb; margin-top:6px; }
#detailPanel .dp-row b{ flex:0 0 38px; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-label); font-weight:500; padding-top:3px; }
</style>
</head>

  if (screensaver) document.body.classList.add('ss');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const levelColor = { info:'var(--accent-info)', warn:'var(--accent-warn)', error:'var(--accent-error)', debug:'var(--accent-debug)' };

  // ---------- lanes (purely local rendering concept, independent of server) ----------
  let laneCount = 0, laneEls = [], laneNextAvailable = [];
  function buildLanes(){
    const h = lanesCol.parentElement.clientHeight;
    laneCount = Math.max(4, Math.floor(h / LANE_HEIGHT));
    lanesCol.innerHTML = '';
    laneEls = []; laneNextAvailable = new Array(laneCount).fill(0);
    for (let i=0;i<laneCount;i++){
      const d = document.createElement('div'); d.className='lane'; d.style.height=(100/laneCount)+'%';
      lanesCol.appendChild(d); laneEls.push(d);
    }
  }
  buildLanes();
  window.addEventListener('resize', buildLanes);
  function freeLaneIndex(){
    const now = performance.now();
    const candidates = [];
    for (let i=0;i<laneNextAvailable.length;i++) if (now >= laneNextAvailable[i]) candidates.push(i);
    if (!candidates.length) return -1;
    return candidates[Math.floor(Math.random()*candidates.length)];
  }

  // ---------- state ----------
  let present = true;
  let currentFilter = 'all';
  const streamEls = new Map();   // id -> { el, laneIdx, translateAnim, innerAnim, caught, entry }
  let pendingCatchId = null;
  let openDetailId = null;
  let zCounter = 0;

  function updateStatus(activeCount){
    statusText.textContent = present && livePaused
      ? `paused — ${activeCount} held`
      : present
      ? `streaming — ${activeCount} active`
      : `away — banking flagged entries only`;
  }

  // log text is untrusted: escape before it goes anywhere near innerHTML
  const esc = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- rendering a stream ----------
  function spawnStream(entry, elapsedSeconds){
    const idx = freeLaneIndex();
    if (idx === -1) return; // this client's local lane budget is full - just skip it visually
    const lane = laneEls[idx];
    const el = document.createElement('div');
    el.className = 'stream lvl-' + entry.level + (entry.replay ? ' replay' : '') + ' fresh';
    el.style.zIndex = ++zCounter;
    el.innerHTML = `
      <span class="head">▍${esc(entry.level.toUpperCase())}</span>
      <span class="src">${esc(entry.source)}</span>
      <span class="msg-wrap"><span class="msg">${esc(entry.message)}</span></span>
    `;
    lane.appendChild(el);

    const laneWidth = lane.clientWidth || 800;
    const elWidth = el.offsetWidth;
    const durationMs = entry.duration * 1000;
    const remainingMs = Math.max(0, durationMs - elapsedSeconds*1000);

    laneNextAvailable[idx] = performance.now() + remainingMs * OVERLAP_AT;

    const rec = { el, laneIdx: idx, translateAnim:null, innerAnim:null, caught:false, entry };
    streamEls.set(entry.id, rec);

    if (!reduceMotion){
      const startPx = laneWidth - (laneWidth+elWidth+60) * (elapsedSeconds*1000/durationMs);
      rec.translateAnim = el.animate(
        [{ transform:`translate(${startPx}px,-50%)` }, { transform:`translate(-${elWidth+30}px,-50%)` }],
        { duration: remainingMs, easing:'linear', fill:'forwards' }
      );
      const msgSpan = el.querySelector('.msg');
      const wrapEl = el.querySelector('.msg-wrap');
      const overflow = msgSpan.scrollWidth - wrapEl.clientWidth;
      wrapEl.classList.toggle('overflow', overflow > 0);
      if (overflow > 0){
        const revealMs = durationMs*0.90, revealDelayMs = durationMs*0.04;
        const already = Math.max(0, elapsedSeconds*1000 - revealDelayMs);
        const remainingReveal = Math.max(50, revealMs - already);
        const startOffset = Math.min(overflow+24, (overflow+24) * (already/revealMs));
        rec.innerAnim = msgSpan.animate(
          [{ transform:`translateX(-${startOffset}px)` }, { transform:`translateX(-${overflow+24}px)` }],
          { duration: remainingReveal, easing:'linear', fill:'forwards' }
        );
      }
    }
    rec.translateAnim && (rec.translateAnim.onfinish = () => removeStream(entry.id));
    if (held) [rec.translateAnim, rec.innerAnim].forEach(x => x && x.pause());
    if (reduceMotion){
      el.style.left = '50%'; el.style.transform = 'translate(-50%,-50%)';
      el.animate([{opacity:0},{opacity:1},{opacity:1},{opacity:0}], {duration:3200, easing:'ease-in-out'});
      setTimeout(()=>removeStream(entry.id), remainingMs);
    }

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      // already caught elsewhere (or by a snapshot): the engine won't re-broadcast, so open detail directly
      if (rec.caught){ openDetail(entry); return; }
      pendingCatchId = entry.id;
      send(JSON.stringify({action:'catch', id: entry.id}));
    });

    updateStatus(streamEls.size);
  }

  function removeStream(id){
    const rec = streamEls.get(id);
    if (!rec) return;
    rec.el.remove();
    streamEls.delete(id);
    updateStatus(streamEls.size);
  }

  function applyCatch(id, elapsedSeconds){
    const rec = streamEls.get(id);
    if (!rec) return;
    rec.caught = true;
    rec.el.classList.add('caught');
    rec.translateAnim && rec.translateAnim.pause();
    rec.innerAnim && rec.innerAnim.pause();
    if (id === pendingCatchId){
      pendingCatchId = null;
      openDetail(rec.entry);
    }
  }

  function applyRelease(id){
    const rec = streamEls.get(id);
    if (!rec){ if (openDetailId === id) closeDetail(); return; }
    rec.caught = false;
    rec.el.classList.remove('caught');
    if (!held){ rec.translateAnim && rec.translateAnim.play(); rec.innerAnim && rec.innerAnim.play(); }
    if (openDetailId === id) closeDetail();
  }

  function applyDismiss(id){
    const rec = streamEls.get(id);
    if (!rec) return;
    rec.caught = false;
    rec.el.classList.remove('caught');
    rec.translateAnim && rec.translateAnim.pause();
    rec.innerAnim && rec.innerAnim.pause();
    const fade = rec.el.animate([{opacity:1},{opacity:0}], {duration:650, easing:'ease-in', fill:'forwards'});
    fade.onfinish = () => removeStream(id);
    if (openDetailId === id) closeDetail();
  }

  // ---------- detail panel ----------
  function openDetail(entry){
    openDetailId = entry.id;
    const color = levelColor[entry.level];
    detailPanel.innerHTML = `
      <div class="dp-top">
        <span class="dp-level" style="color:${color}; border-color:${color};">${esc(entry.level)}</span>
        <button class="dp-close" id="dpClose">×</button>
      </div>
      <div class="dp-meta"><span>${esc(entry.ts)}</span><span>${esc(entry.source)}</span></div>
      <div class="dp-msg">${esc(entry.message)}</div>
      <div class="dp-explain" id="dpExplain"></div>
      <div class="dp-hint">Tap outside to let it drift on.</div>
    `;
    detailPanel.classList.remove('hidden');
    document.getElementById('dpClose').onclick = () => send(JSON.stringify({action:'release', id: entry.id}));
    send(JSON.stringify({action:'explain', id: entry.id}));
  }
  // what the entry is and why it is there; written once per kind of entry (explain.py) and looked up by the engine
  function showExplanation(msg){
    const box = document.getElementById('dpExplain');
    if (!box || msg.id !== openDetailId) return;
    box.innerHTML = msg.found
      ? `<div class="dp-cat">${esc(msg.category)}</div><div class="dp-title">${esc(msg.title)}</div>
         <div class="dp-row"><b>What</b><span>${esc(msg.what)}</span></div>
         <div class="dp-row"><b>Why</b><span>${esc(msg.why)}</span></div>`
      : `<div class="dp-cat">Not catalogued yet</div><div class="dp-row"><span>Nobody has written down what this kind of entry is. It will be explained on the next pass.</span></div>`;
  }
  function closeDetail(){
    openDetailId = null;
    detailPanel.classList.add('hidden');
    detailPanel.innerHTML = '';
  }
  window.addEventListener('keydown', (e) => {          // Escape backs out of a catch (DESIGN 5.2)
    if (e.key === 'Escape' && openDetailId !== null) send(JSON.stringify({action:'release', id: openDetailId}));
  });
  document.addEventListener('click', (e) => {
    if (openDetailId === null) return;
    if (detailPanel.contains(e.target)) return;
    const rec = streamEls.get(openDetailId);
    if (rec && rec.el.contains(e.target)) return;
    send(JSON.stringify({action:'release', id: openDetailId}));
  });

  // ---------- controls ----------
  document.querySelectorAll('.chip[data-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      send(JSON.stringify({action:'set_filter', level: btn.dataset.level}));
    });
  });
  presenceBtn.addEventListener('click', () => {
    send(JSON.stringify({action:'toggle_presence'}));
  });
  flaggedBadge.addEventListener('click', (e) => {
    e.stopPropagation();
    if (flaggedReason === 'paused') send(JSON.stringify({action:'live_resume'}));
    else if (flaggedReason === 'playback') send(JSON.stringify({action:'playback_stop'}));   // back to live, banked entries replay
    else if (!present) send(JSON.stringify({action:'toggle_presence'}));
  });
  function showFlagged(count, reason){
    flaggedReason = reason || 'away';
    if (count > 0){
      flaggedBadge.textContent = flaggedReason === 'paused'
        ? `${count} held back — click to resume`
        : flaggedReason === 'playback'
        ? `${count} live since — click for live` : `${count} flagged while away — click to replay`;
      flaggedBadge.classList.remove('hidden');
    } else flaggedBadge.classList.add('hidden');
  }

  function applyFilterUI(level){
    currentFilter = level;
    document.querySelectorAll('.chip[data-level]').forEach(b => b.classList.toggle('active', b.dataset.level === level));
  }
  function applyPresenceUI(isPresent){
    present = isPresent;
    presenceBtn.classList.toggle('away', !present);
    presenceBtn.innerHTML = present ? '<span class="pip"></span>At desk' : '<span class="pip"></span>Away';
    updateStatus(streamEls.size);
  }

  // ---------- timeline (DESIGN 5.6) ----------
  // The engine sends an anchor (virtual_now, rate, paused); the clock is derived here, never ticked from the server.
  const tlControls = document.getElementById('tlControls'), tlClock = document.getElementById('tlClock');
  const WIN_LABEL = {300:'5m', 1800:'30m', 3600:'1h', 21600:'6h', 43200:'12h', 86400:'24h'};
  let pb = null, flaggedReason = 'away';

  function windowLabel(sec){
    if (WIN_LABEL[sec]) return WIN_LABEL[sec];
    if (sec < 90) return Math.round(sec) + 's';
    return sec >= 3600 ? (sec/3600).toFixed(1).replace(/\.0$/,'') + 'h' : Math.round(sec/60) + 'm';
  }
  function vnow(){
    if (!pb) return 0;
    if (pb.paused) return pb.v0;
    return Math.min(pb.v_end, pb.v0 + (performance.now() - pb.t0) / 1000 * pb.rate);
  }
  // The clock outlives the playback: it stays up (frozen at where it ended) for as long as replayed streams are
  // still crossing the screen, including the banked live entries that are replayed on return.
  let tail = null, glitchTimer = 0;
  function glitchOut(){                        // the clock's goodbye: break up, collapse, gone
    if (tlClock.classList.contains('glitch')) return;
    if (reduceMotion){ tail = null; renderTimeline(); return; }
    tlClock.classList.add('glitch');
    glitchTimer = setTimeout(() => { tail = null; tlClock.classList.remove('glitch'); renderTimeline(); }, 540);
  }
  const replaysOnScreen = () => { for (const r of streamEls.values()) if (r.entry.replay) return true; return false; };

  // Pausing the timeline holds the streams on screen. The engine freezes their clocks at once; here they ease to a
  // stop (and ease back up on resume) instead of freezing dead. Caught streams are already still.
  let held = false, rampRaf = 0, livePaused = false;
  function eachAnim(fn){ streamEls.forEach(rec => { if (!rec.caught) [rec.translateAnim, rec.innerAnim].forEach(a => a && fn(a)); }); }
  function syncHold(instant){
    const want = !!(pb && pb.paused) || livePaused;
    if (want === held) return;
    held = want;
    cancelAnimationFrame(rampRaf);
    if (instant || reduceMotion){ eachAnim(a => { a.playbackRate = 1; want ? a.pause() : a.play(); }); return; }
    const t0 = performance.now(), ms = want ? 800 : 500;
    if (!want) eachAnim(a => { a.playbackRate = 0.001; a.play(); });
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      const rate = want ? (1 - k) * (1 - k) : k * k;          // decelerate into the stop, accelerate out of it
      eachAnim(a => { a.playbackRate = Math.max(rate, 0.001); });
      if (k < 1) rampRaf = requestAnimationFrame(step);
      else if (want) eachAnim(a => { a.pause(); a.playbackRate = 1; });
    };
    step();
  }

  function setPlayback(p, how){
    if (!p && pb) tail = { v: how === 'end' ? pb.v_end : vnow(), window_s: pb.window_s, v_start: pb.v_start, v_end: pb.v_end,
                           flagged_only: pb.flagged_only, kind: pb.kind, since: performance.now() };
    if (p){ tail = null; clearTimeout(glitchTimer); tlClock.classList.remove('glitch'); }
    pb = p ? { window_s:p.window_s, v_start:p.v_start, v_end:p.v_end, rate:p.rate, v0:p.virtual_now,
               t0:performance.now(), paused:!!p.paused, skipped:p.skipped || 0, flagged_only:!!p.flagged_only, kind:p.kind || 'timeline' } : null;
    syncHold(how === 'snapshot');
    renderTimeline();
  }
  function renderTimeline(){
    tlClock.classList.toggle('hidden', !pb && !tail);
    tlClock.classList.toggle('paused', !!(pb && pb.paused));
    tlControls.querySelectorAll('[data-win]').forEach(b => {
      b.classList.toggle('tl-on', !!pb && !pb.flagged_only && WIN_LABEL[pb.window_s] === b.dataset.win);
    });
    tlControls.classList.toggle('live', !!pb || livePaused);
    document.getElementById('tlStop').classList.toggle('hidden', !pb);
    document.getElementById('tlPause').textContent = (pb ? pb.paused : livePaused) ? 'Resume' : 'Pause';
    updateClock();
  }
  function updateClock(){
    if (!pb && tail && performance.now() - tail.since > 1500 && !replaysOnScreen()){ glitchOut(); return; }
    const cur = pb || tail;
    if (!cur) return;
    const v = pb ? vnow() : tail.v, d = new Date(v * 1000);
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    const otherDay = d.toDateString() !== new Date().toDateString();
    document.getElementById('tlTime').textContent = (otherDay ? d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase() + ' ' : '') + hh + ':' + mm;
    // lit strip: 60 discrete segments (240 units, 4 per segment); it steps, it does not glide
    const frac = Math.max(0, Math.min(1, (v - cur.v_start) / (cur.v_end - cur.v_start)));
    document.getElementById('tlRing').setAttribute('stroke-dashoffset', String(240 - Math.floor(frac * 60) * 4));
    document.getElementById('tlFrom').textContent = cur.flagged_only ? 'Away' : '-' + windowLabel(cur.window_s);
    const catchup = cur.kind === 'catchup';
    document.getElementById('tlPlate').textContent = catchup ? 'Catch-up' : 'Playback';
    let meta = cur.flagged_only ? 'SINCE YOU LEFT' : '-' + windowLabel(cur.window_s).toUpperCase();
    if (pb && catchup && !pb.paused){            // countdown to live: real seconds left in the replay
      const left = Math.max(0, Math.ceil((pb.v_end - v) / pb.rate));
      meta = `LIVE IN ${Math.floor(left / 60)}:${String(left % 60).padStart(2,'0')}`;
    }
    document.getElementById('tlMeta').textContent = meta + (pb && pb.skipped ? ` +${pb.skipped}` : '')
      + (pb ? (pb.paused ? ' PAUSED' : '') : (catchup ? ' LIVE' : ' ENDED'));
    document.getElementById('lampRun').classList.toggle('on', !!pb && !pb.paused);
    document.getElementById('lampHold').classList.toggle('on', !!pb && pb.paused);
    document.getElementById('lampAway').classList.toggle('on', !!cur.flagged_only);
    document.getElementById('lampEnd').classList.toggle('on', !pb);
  }
  setInterval(updateClock, 200);

  tlControls.querySelectorAll('[data-win]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation(); send(JSON.stringify({action:'playback', window:b.dataset.win})); setTlOpen(false);
  }));
  document.getElementById('tlPause').addEventListener('click', (e) => {
    e.stopPropagation(); togglePause();
  });
  // one pause for both modes: a playing timeline pauses its replay, otherwise the live view holds (DESIGN 5.9)
  function togglePause(){
    const a = pb ? (pb.paused ? 'playback_resume' : 'playback_pause') : (livePaused ? 'live_resume' : 'live_pause');
    send(JSON.stringify({action: a}));
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && !e.target.closest?.('input, textarea, button')){ e.preventDefault(); togglePause(); }
  });
  function setLivePaused(on){
    livePaused = !!on;
    syncHold(false);
    renderTimeline();
    updateStatus(streamEls.size);
  }
  document.getElementById('tlStop').addEventListener('click', (e) => {
    e.stopPropagation(); send(JSON.stringify({action:'playback_stop'}));
  });

  // the controls are one faint toggle; it opens a column of keys on tap and closes itself a few seconds after the last touch
  let tlCloseTimer;
  function setTlOpen(on){
    tlControls.classList.toggle('open', on);
    document.getElementById('tlLabel').setAttribute('aria-expanded', String(on));
    clearTimeout(tlCloseTimer);
    if (on) tlCloseTimer = setTimeout(() => setTlOpen(false), 6000);   // not :hover, which sticks after a touch
  }
  document.getElementById('tlLabel').addEventListener('click', (e) => { e.stopPropagation(); setTlOpen(!tlControls.classList.contains('open')); });
  tlControls.addEventListener('click', () => { if (tlControls.classList.contains('open')) setTlOpen(true); });

  // ---------- desk events (screensaver only) ----------
  // Someone touching the machine while the saver is up is worth knowing about later. These go to the engine's
  // history (timeline playback only, never the live view) and to the extension's activity log.
  const DESK_QUIET_MS = Number(params.get('deskquiet')) || 30000;   // quiet gap that makes the next input notable
  const loadedAt = performance.now();
  let openedReported = false, lastInputAt = loadedAt;
  const humanQuiet = (ms) => { const m = Math.round(ms / 60000); return m >= 120 ? `${(m/60).toFixed(1)}h` : m >= 1 ? `${m}m` : `${Math.round(ms/1000)}s`; };
  function desk(kind, detail){
    send(JSON.stringify({action:'desk', kind, detail}));
    try { if (params.get('ext') && window.chrome && chrome.runtime && chrome.runtime.sendMessage)
      chrome.runtime.sendMessage(params.get('ext'), {type:'note', what:'desk ' + kind, detail:{text:detail}}, () => void chrome.runtime.lastError); } catch(e){}
  }
  function noticeInput(type){
    const now = performance.now();
    if (now - loadedAt < 2000) return;                     // a freshly opened window gets synthetic pointer events
    const quiet = now - lastInputAt;
    lastInputAt = now;
    if (quiet >= DESK_QUIET_MS) desk('input', `input after ${humanQuiet(quiet)} quiet (${type})`);
  }
  if (screensaver){
    window.addEventListener('pointerdown', (e) => noticeInput(e.pointerType || 'pointer'), true);
    window.addEventListener('pointermove', (e) => noticeInput(e.pointerType || 'pointer'), true);
    window.addEventListener('keydown', () => noticeInput('key'), true);
    window.addEventListener('wheel', () => noticeInput('wheel'), true);
  }

  // ---------- screensaver exit ----------
  // Leave with an inward swipe that starts at any screen edge (touch, pen or mouse-drag), or Escape.
  // Ordinary mouse movement, clicks and keys do NOT leave: streams are interactive here.
  if (screensaver){
    const EDGE = 24, SWIPE = 64;
    const ext = params.get('ext');
    const canTell = () => !!(ext && window.chrome && chrome.runtime && chrome.runtime.sendMessage);
    const tell = (msg) => { try { if (canTell()) chrome.runtime.sendMessage(ext, msg, () => void chrome.runtime.lastError); } catch(e){} };
    const leave = (why) => {
      document.title = 'ALM-EXIT';
      desk('dismissed', why.kind === 'edge-swipe' ? `dismissed by edge swipe from ${why.edge} (${why.pointerType})` : 'dismissed by Escape');
      // Let the websocket frame go out first. The extension closes the window (and releases keep-awake) on the
      // message; closing ourselves first would race it, so window.close() is only a delayed fallback.
      setTimeout(() => tell({type:'dismiss', why}), canTell() ? 150 : 0);
      setTimeout(() => { try { window.close(); } catch(e){} }, canTell() ? 850 : 150);
    };
    // A few throttled breadcrumbs for the extension's activity log (options page), so a surprise
    // dismissal can be traced to what the device actually delivered. Not sent for ordinary moves.
    let notes = 0;
    const note = (what, detail) => { if (notes++ < 30) tell({type:'note', what, detail}); };
    const edgeOf = (x, y) => x <= EDGE ? 'left' : x >= innerWidth - EDGE ? 'right' : y <= EDGE ? 'top' : y >= innerHeight - EDGE ? 'bottom' : null;

    let track = null;
    window.addEventListener('pointerdown', (e) => {
      const edge = edgeOf(e.clientX, e.clientY);
      track = edge ? { id:e.pointerId, edge, x:e.clientX, y:e.clientY } : null;
      if (edge) note('edge-touch', {type:e.pointerType, x:Math.round(e.clientX), y:Math.round(e.clientY), edge, vw:innerWidth, vh:innerHeight});
    }, true);
    window.addEventListener('pointermove', (e) => {
      if (!track || e.pointerId !== track.id) return;
      const dx = e.clientX - track.x, dy = e.clientY - track.y;
      const inward = { left:dx, right:-dx, top:dy, bottom:-dy }[track.edge];
      const along = (track.edge === 'left' || track.edge === 'right') ? Math.abs(dy) : Math.abs(dx);
      if (inward >= SWIPE && inward > along){
        const why = { kind:'edge-swipe', edge:track.edge, pointerType:e.pointerType, from:[Math.round(track.x), Math.round(track.y)],
                      to:[Math.round(e.clientX), Math.round(e.clientY)], viewport:[innerWidth, innerHeight], dpr:devicePixelRatio };
        track = null; leave(why);
      }
    }, true);
    window.addEventListener('pointercancel', (e) => { note('pointercancel', {type:e.pointerType}); track = null; }, true);
    window.addEventListener('pointerup', () => { track = null; }, true);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && openDetailId === null) leave({kind:'escape', trusted:e.isTrusted});
    });
    document.addEventListener('visibilitychange', () => note('visibility', {state:document.visibilityState}));
    window.addEventListener('pagehide', () => note('pagehide', {}));
    window.addEventListener('blur', () => note('blur', {}));
    window.addEventListener('fullscreenchange', () => note('fullscreenchange', {fs:!!document.fullscreenElement}));

    // hide the cursor after 3s without movement
    let calmTimer;
    const stir = () => { document.body.classList.remove('calm'); clearTimeout(calmTimer);
      calmTimer = setTimeout(() => document.body.classList.add('calm'), 3000); };
    window.addEventListener('pointermove', stir, true); stir();
  }

  // ---------- websocket (auto-reconnecting) ----------
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsUrl = `${proto}://${location.host}/ws` + (token ? `?token=${encodeURIComponent(token)}` : '');
  const offlineEl = document.getElementById('ssOffline');
  let ws = null, retryMs = 500;
  function send(data){ if (ws && ws.readyState === WebSocket.OPEN) ws.send(data); }

  // Every snapshot starts from a clean slate, so a reconnect cannot duplicate or strand streams.
  function resetStreams(){
    streamEls.forEach(rec => rec.el.remove());
    streamEls.clear();
    laneNextAvailable.fill(0);
    pendingCatchId = null;
    closeDetail();
    flaggedBadge.classList.add('hidden');
  }

  function connect(){
    ws = new WebSocket(wsUrl);
    ws.addEventListener('open', () => {
      retryMs = 500;
      if (screensaver && !openedReported){ openedReported = true; desk('opened', 'screensaver opened'); }
      liveDot.classList.remove('offline');
      offlineEl.classList.add('hidden');
    });
    ws.addEventListener('close', () => {
      liveDot.classList.add('offline');
      statusText.textContent = 'disconnected, retrying';
      if (screensaver) offlineEl.classList.remove('hidden');
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 15000);
    });
    ws.addEventListener('message', onMessage);
  }

  function onMessage(ev){
    const msg = JSON.parse(ev.data);
    switch (msg.type){
      case 'snapshot':
        resetStreams();
        applyFilterUI(msg.filter);
        applyPresenceUI(msg.present);
        showFlagged(msg.flagged_count, msg.flagged_reason);
        livePaused = !!msg.live_paused;
        setPlayback(msg.playback, 'snapshot');
        msg.streams.forEach(entry => {
          spawnStream(entry, entry.elapsed);
          // spawnStream positions at entry.elapsed; freeze there. No detail panel: pendingCatchId is unset.
          if (entry.dismiss_elapsed !== null && entry.dismiss_elapsed !== undefined) applyDismiss(entry.id);
          else if (entry.caught) applyCatch(entry.id, entry.elapsed);
        });
        break;
      case 'spawn':
        spawnStream(msg, 0);
        break;
      case 'catch':
        applyCatch(msg.id, msg.elapsed);
        break;
      case 'explain':
        showExplanation(msg);
        break;
      case 'release':
        applyRelease(msg.id);
        break;
      case 'dismiss':
        applyDismiss(msg.id);
        break;
      case 'exit':
        removeStream(msg.id);
        break;
      case 'presence':
        applyPresenceUI(msg.present);
        break;
      case 'filter':
        applyFilterUI(msg.level);
        break;
      case 'flagged_count':
        showFlagged(msg.count, msg.reason);
        break;
      case 'live_pause':
        setLivePaused(msg.paused);
        break;
      case 'playback':
        if (msg.state === 'stop' || msg.state === 'end') setPlayback(null, msg.state); else setPlayback(msg);
        break;
      case 'playback_stats':
        if (pb){ pb.skipped = msg.skipped; updateClock(); }
        break;
    }
  }
  connect();
})();
</script>
